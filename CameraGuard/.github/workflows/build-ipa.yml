name: Build-iOS-IPA

on:
  push:
    branches: [ main, trae/agent-URPsnL ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project CameraGuard.xcodeproj \
            -scheme CameraGuard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find ./build/Build/Products -maxdepth 1 -type d -name "Release-iphoneos")
          echo "APP_PATH=$APP_PATH"
          ls -la "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH/CameraGuard.app" Payload/
          zip -qry CameraGuard-unsigned.ipa Payload
          ls -lh CameraGuard-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CameraGuard-ipa
          path: CameraGuard-unsigned.ipa
          retention-days: 7