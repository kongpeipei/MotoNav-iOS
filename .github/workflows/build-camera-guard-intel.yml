# 云端编译「电子眼卫士」IPA（未签名，下载后用全能签等工具签名安装）
# 仅当 CameraGuard 目录变更时触发（不影响 MotoNav 主工程工作流）
name: Build CameraGuard IPA (Intel)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          APP=$(ls /Applications | grep '^Xcode' | sort | tail -1)
          echo "选用: $APP"
          sudo xcode-select -s "/Applications/$APP"
          xcodebuild -version

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project CameraGuard/CameraGuard.xcodeproj \
            -scheme CameraGuard \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO

      - name: Ad-hoc sign (便于全能签重签)
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP_PATH"
          test -n "$APP_PATH"
          codesign --force --sign - "$APP_PATH"

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr CameraGuard-unsigned.ipa Payload
          ls -la CameraGuard-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CameraGuard-unsigned-ipa-intel
          path: CameraGuard-unsigned.ipa
          retention-days: 7
