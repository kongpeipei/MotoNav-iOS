# =============================================================================
# 云端编译「未签名 IPA」 —— 全程不需要 Mac，GitHub 免费 macOS 机器出包
#
# 产物：MotoNav-unsigned-v<版本>-b<构建号>.ipa（未签名，供全能签/Sideloadly 重签）
# 触发：push 到 main（改文档/安卓目录不触发）或手动 Run workflow
#
# v1.99 流程精简（原 14 步 → 5 步，单次构建约省 2 分钟）：
#   1. 删除"先单独全量 build 一遍再 archive"的步骤：archive 本身就会完整编译，
#      旧版等于把整个工程编译两遍（一遍 singlefile 一遍 wholemodule）。
#      现在编译错误直接在 archive 步骤输出，失败时仍上传完整日志。
#   2. 不调用 -exportArchive：无签名工程必然失败/回退，直接 zip 归档产物，
#      省掉一次 xcodebuild 启动 + 一次必然失败的重试（约 25 秒）。
#   3. 环境自检 / 文件清单 / xcodebuild -list / 密钥注入 / 工程修补 / 版本号 /
#      ExportOptions 合并进 2 个步骤，减少 step 启动开销。
#   4. 瘦身与装包合并：归档后只解包一次、压缩一次（旧版 zip→unzip→zip 三轮）。
#   5. 产物上传用 compression-level 0（IPA 已是压缩包，再压纯属浪费 CPU）。
#   6. 保留安全校验：PlugIns 已剥离（v2.03 起刻意不带扩展，避免重签后启动闪退）、
#      CarPlay 场景声明已移除、主程序 Info 完整。
# =============================================================================
name: Build IPA

on:
  workflow_dispatch:
    inputs:
      fix_widget_point:
        description: "Widget 扩展点切换（默认 widgetkit，异常时选 activitykit）"
        type: choice
        default: widgetkit
        options:
          - widgetkit
          - activitykit-extension
          - activitykit
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'Android_MotoNav/**'

# 同一分支只跑最新一次，避免重复排队
concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: MotoNav.xcodeproj
  SCHEME: MotoNav
  ARTIFACT: MotoNav-unsigned

jobs:
  # =============================================================================
  # 快速类型检查（优化建议 #3）
  #
  # 为什么单独一个 job：
  #   archive 打包要 4~6 分钟，其中绝大部分时间花在"编译 + 归档 + 装包"上。
  #   而开发者最常见的错误是**编译错误**（类型不匹配、成员未声明、参数写错）。
  #   这个 job 只做 xcodebuild build（不打包），1~2 分钟就能出结果，
  #   两者并行跑，整体等待时间几乎不变，但"编译错了"能早 3~4 分钟知道。
  #
  # 加上它还有一个好处：archive 失败时，日志里已经有明确的类型检查结论，
  #   不用在几百行 xcodebuild 输出里翻找。
  # =============================================================================
  typecheck:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - name: 1) Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2) 本地静态校验（1 秒）
        run: |
          set -e
          python3 .ci/swift_lint.py

      - name: 3) 只编译，不打包（类型检查）
        env:
          IN_AMAP_KEY: ${{ secrets.AMAP_KEY }}
          IN_XF_APP_ID: ${{ secrets.XF_APP_ID }}
          IN_XF_API_KEY: ${{ secrets.XF_API_KEY }}
          IN_XF_API_SECRET: ${{ secrets.XF_API_SECRET }}
        run: |
          set -o pipefail
          # 密钥注入（与 build job 一致；为空也不影响编译）
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path("MotoNav/Secrets.swift"); s = p.read_text(encoding="utf-8")
          for k, env in [("__SECRET_AMAP_KEY__","IN_AMAP_KEY"),("__SECRET_XF_APP_ID__","IN_XF_APP_ID"),
                         ("__SECRET_XF_API_KEY__","IN_XF_API_KEY"),("__SECRET_XF_API_SECRET__","IN_XF_API_SECRET")]:
              v = os.environ.get(env, "")
              if v.strip(): s = s.replace('"'+k+'"', '"'+v.strip()+'"')
          p.write_text(s, encoding="utf-8")
          PY
          xcodebuild build \
            -project MotoNav.xcodeproj \
            -scheme MotoNav \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-check" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_BITCODE=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -quiet > typecheck.log 2>&1 || {
              echo "=== 类型检查失败，错误行 ==="
              grep -E "error:" typecheck.log | head -30
              echo "=== 末 60 行 ==="; tail -60 typecheck.log; exit 1; }
          echo "类型检查通过 ✅"

      - name: 失败时保留类型检查日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-logs
          path: typecheck.log
          if-no-files-found: ignore
          retention-days: 7

  build:
    # macos-15 = Xcode 16.x 镜像（工程 objectVersion 77 / 文件系统同步组，需要 Xcode 16+）
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: 1) Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 准备阶段：密钥注入 + 工程修补 + 版本号 + 打包环境自检，一次 shell 完成
      - name: 2) 准备（密钥 / 工程修补 / 版本号 / 导出配置）
        env:
          IN_AMAP_KEY: ${{ secrets.AMAP_KEY }}
          IN_XF_APP_ID: ${{ secrets.XF_APP_ID }}
          IN_XF_API_KEY: ${{ secrets.XF_API_KEY }}
          IN_XF_API_SECRET: ${{ secrets.XF_API_SECRET }}
          FIX_WIDGET_POINT: ${{ inputs.fix_widget_point || 'widgetkit' }}
        run: |
          set -e
          echo "== 环境 =="
          sw_vers -productVersion
          xcodebuild -version | head -2
          echo "runner: $RUNNER_NAME $(uname -m)"

          echo "== 关键文件核对 =="
          for f in "$PROJECT/project.pbxproj" Config/Info.plist MotoNav/Secrets.swift; do
            [ -e "$f" ] && echo "  OK   $f" || echo "  MISS $f"
          done

          # ---- 密钥注入（源码只留占位符；Secrets 为空时自动降级，不影响编译）----
          SECFILE=MotoNav/Secrets.swift
          if [ ! -f "$SECFILE" ]; then
            echo "[warn] $SECFILE 缺失，生成占位模板"
            printf '%s\n' \
              'import Foundation' \
              'enum AppSecrets {' \
              '    static let amapKey = "__SECRET_AMAP_KEY__"' \
              '    static let xfAppId = "__SECRET_XF_APP_ID__"' \
              '    static let xfApiKey = "__SECRET_XF_API_KEY__"' \
              '    static let xfApiSecret = "__SECRET_XF_API_SECRET__"' \
              '    static func value(_ s: String) -> String {' \
              '        if s.hasPrefix("__SECRET_") && s.hasSuffix("__") { return "" }' \
              '        return s' \
              '    }' \
              '}' > "$SECFILE"
          fi
          python3 - "$SECFILE" <<'PY'
          import os, sys, pathlib
          p = pathlib.Path(sys.argv[1]); s = p.read_text(encoding="utf-8")
          mapping = {
              "__SECRET_AMAP_KEY__": os.environ.get("IN_AMAP_KEY", ""),
              "__SECRET_XF_APP_ID__": os.environ.get("IN_XF_APP_ID", ""),
              "__SECRET_XF_API_KEY__": os.environ.get("IN_XF_API_KEY", ""),
              "__SECRET_XF_API_SECRET__": os.environ.get("IN_XF_API_SECRET", ""),
          }
          for k, v in mapping.items():
              if v.strip(): s = s.replace('"' + k + '"', '"' + v.strip() + '"')
          p.write_text(s, encoding="utf-8")
          for k in ["amapKey", "xfAppId", "xfApiKey", "xfApiSecret"]:
              for line in s.splitlines():
                  if "let %s = " % k in line:
                      v = line.split("=", 1)[1].strip().strip('"')
                      print("  %s: %s" % (k, "已注入" if v and not v.startswith("__SECRET_") else "未注入（功能降级）"))
                      break
          PY

          # ---- 工程兜底修补（Live Activity 初始化器 / CarPlay 场景安全性）----
          python3 .ci/sync_extensions.py .

          # ---- 版本号 ----
          MARKETING=$(grep -m1 'MARKETING_VERSION' "$PROJECT/project.pbxproj" | sed -E 's/.*MARKETING_VERSION = ([^;]+);.*/\1/')
          BUILD_NO=$(date -u +%Y%m%d%H%M)
          echo "MARKETING=$MARKETING" >> "$GITHUB_ENV"
          echo "BUILD_NO=$BUILD_NO" >> "$GITHUB_ENV"
          echo "版本 $MARKETING ($BUILD_NO)  提交 ${GITHUB_SHA::7}"

          # ---- 导出配置（保留给未来签名构建用；本次走手工装包）----
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>development</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>-</string>
            <key>provisioningProfiles</key><dict/>
            <key>teamID</key><string></string>
            <key>stripSwiftSymbols</key><true/>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>compileBitcode</key><false/>
            <key>uploadSymbols</key><false/>
          </dict>
          </plist>
          EOF
          plutil -lint ExportOptions.plist

      # 编译 + 归档一步完成（旧版是"先 build 一遍，再 archive 一遍"，编译两遍）
      - name: 3) Archive（编译 + 归档）
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MotoNav.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            MARKETING_VERSION="$MARKETING" \
            CURRENT_PROJECT_VERSION="$BUILD_NO" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_BITCODE=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            SWIFT_COMPILATION_MODE=wholemodule \
            COMPILER_INDEX_STORE_ENABLE=NO \
            VALIDATE_PRODUCT=NO \
            -quiet > archive.log 2>&1 || {
              echo "=== 编译/归档失败，末 150 行 ==="; tail -150 archive.log; exit 1; }
          APP=$(find "$RUNNER_TEMP/MotoNav.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          echo "归档完成：$(du -sh "$APP" | cut -f1)  $(basename "$APP")"
          find "$APP/PlugIns" -maxdepth 1 -name '*.appex' 2>/dev/null || echo "!! 归档内无 PlugIns"

      # 装包 + 瘦身 + 校验：只解包一次、压缩一次
      - name: 4) 打包（手工组装 IPA + 瘦身 + 结构校验）
        run: |
          set -e
          OUT="${ARTIFACT}-v${MARKETING}-b${BUILD_NO}.ipa"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          W="$RUNNER_TEMP/pkg"; rm -rf "$W"; mkdir -p "$W/Payload"
          APP=$(find "$RUNNER_TEMP/MotoNav.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -1)
          cp -R "$APP" "$W/Payload/"

          # v2.03 关键：剥离 Widget 扩展（PlugIns）
          # 第三方签名服务（企业证书/全能签一类）重签时经常只签主 App、漏签或错签 appex，
          # 或者改了主 App 的 BundleID 却没同步改 appex 的子标识；
          # 这两种情况 iOS 启动校验都会直接杀掉主进程 —— 现象就是「点图标闪一下退回桌面」。
          # 扩展只用于灵动岛/锁屏提醒，剥离后 App 全部功能正常，只是没有灵动岛卡片，
          # 换来的是重签成功率的数量级提升（单二进制，签名工具没有出错空间）。
          rm -rf "$W/Payload"/*.app/PlugIns
          echo "== 已剥离扩展 =="

          # 瘦身：调试附件 + Swift 模块接口（重签后无用）
          find "$W/Payload" -name '*.dSYM' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find "$W/Payload" -name '*.swiftmodule' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find "$W/Payload" -name '*.swiftdoc' -delete 2>/dev/null || true

          OUTABS="$GITHUB_WORKSPACE/$OUT"
          (cd "$W" && zip -qry "$OUTABS" Payload)
          echo "== 体积 =="; ls -lh "$OUT" 2>&1 | awk '{print "  "$5"  "$9}'

          # ---- 冒烟检查（优化建议 #21）----
          # 这两类问题以前只能靠人工装机试（几分钟，且容易漏）：
          #   1) 企业签后启动即闪退（漏签 appex / 改了 BundleID 没同步子标识）
          #   2) 覆盖安装不生效（Build 号不变，iOS 沿用旧可执行文件）
          # 现在对产出的 IPA 做静态检查，秒级完成。
          echo "== 冒烟检查 =="
          python3 .ci/smoke_ipa.py "$OUT" "$MARKETING"

          # ---- 结构校验：v2.03 起刻意不带扩展；带扩展反而会让重签失败 ----
          echo "== IPA 结构 =="
          APPIN="Payload/$(basename "$APP")/"   # 末尾斜杠：下面所有拼接都靠它
          if unzip -Z1 "$OUT" | grep -q "^${APPIN}PlugIns/"; then
            echo "!! 包内仍残留 PlugIns（会导致重签后启动即闪退）"
            unzip -Z1 "$OUT" | grep PlugIns | head
            exit 1
          fi
          echo "  PlugIns: 已剥离（单二进制，重签最稳）"
          echo "  CarPlay 场景声明: $(unzip -p "$OUT" "${APPIN}Info.plist" | /usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest' 2>/dev/null >/dev/null && echo '存在(异常)' || echo '已移除')"
          echo "== 主程序 Info =="
          unzip -p "$OUT" "${APPIN}Info.plist" > "$RUNNER_TEMP/main.plist"
          for k in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion MinimumOSVersion; do
            printf '  %-30s %s\n' "$k" "$(/usr/libexec/PlistBuddy -c "Print :$k" "$RUNNER_TEMP/main.plist" 2>/dev/null || echo '-')"
          done
          shasum -a 256 "$OUT" | tee "$OUT.sha256"

      - name: 5) 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            ${{ env.OUT }}
            ${{ env.OUT }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0   # IPA 已是压缩包，避免二次压缩拖慢上传

      - name: 失败时保留编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            archive.log
            ${{ runner.temp }}/MotoNav.xcarchive/Info.plist
          if-no-files-found: ignore
          retention-days: 7

  # =============================================================================
  # 失败通知（优化建议 #1）
  #
  # v2.26 之前，v2.19~v2.25 共 5 个提交只存在本地，
  # CI 连续失败 4 次**没有人知道** —— 因为改动没推上去，没人看 CI；
  # 等推上去时，已经堆了 4 个红色失败。
  #
  # 这个 job 的作用：任一 job 失败时，在 GitHub 上留一条明确的失败摘要，
  # 并在 Actions 页面置顶。不依赖外部 webhook（企业微信/钉钉），
  # 因为那需要额外的密钥配置；GitHub 自身的通知（邮件/网页铃铛）已经够用。
  # =============================================================================
  notify:
    runs-on: ubuntu-latest
    needs: [typecheck, build]
    if: failure()
    steps:
      - name: 写入失败摘要
        run: |
          {
            echo "## ❌ MotoNav 构建失败"
            echo ""
            echo "- 提交：\`${{ github.sha }}\`"
            echo "- 分支：\`${{ github.ref }}\`"
            echo "- 提交信息：${{ github.event.head_commit.message }}"
            echo ""
            echo "### 快速自查"
            echo ""
            echo "1. 本地跑静态校验（1 秒）：\`python3 .ci/swift_lint.py\`"
            echo "2. 查看 **typecheck** job 的日志，里面有 \`error:\` 行"
            echo "3. 查看 **build** job 的 \`build-logs\` 附件（完整 archive.log）"
            echo ""
            echo "### 常见原因"
            echo ""
            echo "| 症状 | 原因 | 处理 |"
            echo "|---|---|---|"
            echo "| \`cannot convert value 'X' to expected type 'Binding<X>'\` | ViewModifier 里 @Binding 漏写 \`\$\` | 加 \`\$\` |"
            echo "| \`cannot find 'X' in scope\` | 修饰符内部用了未声明的成员 | 在 struct 上声明 \`@Binding var X\` |"
            echo "| \`extraneous argument label\` | 无标签闭包被调用时多写了 label | 去掉 label |"
            echo "| \`invalid redeclaration\` | 同作用域重复定义同名成员 | 改名或删掉重复 |"
            echo "| \`unable to type-check this expression\` | 单个表达式太复杂 | 拆成更小的子表达式/ViewModifier |"
          } > "$GITHUB_STEP_SUMMARY"
          echo "失败摘要已写入 $GITHUB_STEP_SUMMARY"
          compression-level: 0
