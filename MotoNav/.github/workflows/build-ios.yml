name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "trae/agent-Kylrrj"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project MotoNav.xcodeproj \
            -scheme MotoNav \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          APP="DerivedData/Build/Products/Release-iphoneos/MotoNav.app"
          ls -la "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry MotoNav.ipa Payload
          ls -la MotoNav.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotoNav-unsigned-ipa
          path: MotoNav.ipa